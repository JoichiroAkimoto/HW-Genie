[project]
name = "hw-genie"
version = "0.1.0"
description = "Hero Wars Genie CLI"
authors = [{ name = "JoichiroAkimoto" }]
requires-python = ">=3.10, <3.14"
dependencies = [
    "requests>=2.33,<2.35",
    "fastapi>=0.135.3,<0.142.0",
    "uvicorn>=0.44,<0.53",
    "httpx~=0.28.1",
    "sqlalchemy~=2.0.49",
    "sqlalchemy-libsql~=0.2.0",
    "rich~=15.0",
]



[project.scripts]
hw-genie = "hw_genie.main:main"

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 150

[tool.ruff.lint]
# Ruff 0.16 でデフォルトルールが拡張されたため、0.15 までの既定 (E4,E7,E9,F) を明示して維持する
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
]

