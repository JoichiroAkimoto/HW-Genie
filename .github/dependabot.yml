version: 2
updates:
  # 1. Python dependency check (uv workspace root)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Enable grouped updates to avoid notification clutter
    groups:
      python-dependencies:
        patterns:
          - "*"

  # 2. GitHub Actions dependency check
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
