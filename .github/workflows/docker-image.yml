name: Docker Image (GHCR)

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'src/python/**'
      - '.github/workflows/docker-image.yml'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    outputs:
      merge_tags: ${{ steps.meta.outputs.merge_tags }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            suffix: -amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            suffix: -arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/joichiroakimoto/hw-genie"
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: Invalid tag '$REF_NAME'. Must be in format vX.Y.Z" >&2
              exit 1
            fi
            MERGE_TAG="$IMAGE:$REF_NAME"
          elif [[ "$REF" == "refs/heads/main" ]]; then
            MERGE_TAG="$IMAGE:latest"
          else
            echo "ERROR: Image push is only allowed from main or version tags (ref: $REF)" >&2
            exit 1
          fi
          echo "tags=$MERGE_TAG$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "merge_tags=$MERGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=main-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.arch }}

      - name: Smoke test
        run: docker run --rm "${{ steps.meta.outputs.tags }}" hw-genie --help

      - name: Push
        run: docker push "${{ steps.meta.outputs.tags }}"

  merge-manifest:
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest / vX.Y.Z はスモークテスト合格済みの suffix タグを統合して作成する。
      # cancel-in-progress で旧 run が中断された場合、suffix タグと統合タグが
      # 一時的に食い違うことがあるが、次の成功 run で収束する。
      - name: Merge per-arch images into a multi-arch manifest
        env:
          MERGE_TAGS: ${{ needs.build.outputs.merge_tags }}
        run: |
          set -euo pipefail
          # MERGE_TAGS は needs.build.outputs から env 経由で注入されるため SC2153 は誤検知
          # shellcheck disable=SC2153
          MERGE_TAG="$MERGE_TAGS"
          docker buildx imagetools create \
            -t "$MERGE_TAG" \
            "$MERGE_TAG-amd64" \
            "$MERGE_TAG-arm64"