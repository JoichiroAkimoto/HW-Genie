name: Docker Image (GHCR)

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'src/python/**'
      - '.github/workflows/docker-image.yml'
      - '.github/scripts/compute_image_tag.py'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          TAGS_TEXT="$(python3 .github/scripts/compute_image_tag.py "$REF_TYPE" "$REF" "$REF_NAME" "$ARCH")"
          mapfile -t TAGS <<< "${TAGS_TEXT%$'\n'}"
          echo "tags=${TAGS[1]}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=main-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.arch }}

      - name: Smoke test
        run: docker run --rm "${{ steps.meta.outputs.tags }}" hw-genie --help

      # スモークテスト合格後に buildx で push する。この段階で provenance / SBOM
      # の attestation を付与する（build ステップの load では attestation が生成されない）。
      # 再ビルドはビルダーのローカルキャッシュにヒットするため数秒で完了する。
      - name: Push (with provenance & SBOM attestations)
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          TAG: ${{ steps.meta.outputs.tags }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker buildx build \
            --builder "$BUILDER" \
            --platform "linux/$ARCH" \
            --tag "$TAG" \
            --provenance=true --sbom=true \
            --cache-from "type=gha,scope=main-$ARCH" \
            --cache-to "type=gha,mode=max,scope=main-$ARCH" \
            --push .

  merge-manifest:
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest / vX.Y.Z はスモークテスト合格済みの suffix タグを統合して作成する。
      # cancel-in-progress や片方のアーキの Push 失敗時は、suffix タグと統合タグが
      # 一時的に不整合になり得るが、次の成功 run で収束する。
      - name: Merge per-arch images into a multi-arch manifest
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAGS_TEXT="$(python3 .github/scripts/compute_image_tag.py "$REF_TYPE" "$REF" "$REF_NAME" amd64 arm64)"
          mapfile -t TAGS <<< "${TAGS_TEXT%$'\n'}"
          MERGE_TAG="${TAGS[0]}"
          docker buildx imagetools create \
            -t "$MERGE_TAG" \
            "${TAGS[1]}" \
            "${TAGS[2]}"
          docker run --rm "$MERGE_TAG" hw-genie --help
