name: Docker Image (GHCR)

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'uv.lock'
      - 'pyproject.toml'
      - 'src/python/**'
      - '.github/workflows/docker-image.yml'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            suffix: -amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            suffix: -arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/joichiroakimoto/hw-genie"
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: Invalid tag '$REF_NAME'. Must be in format vX.Y.Z" >&2
              exit 1
            fi
            TAGS="$IMAGE:$REF_NAME$SUFFIX"
          elif [[ "$REF" == "refs/heads/main" ]]; then
            TAGS="$IMAGE:latest$SUFFIX"
          else
            echo "ERROR: Image push is only allowed from main or version tags (ref: $REF)" >&2
            exit 1
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=main-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.arch }}

      - name: Smoke test
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE_TAG="${TAGS%%,*}"
          docker run --rm "$IMAGE_TAG" hw-genie --help

  merge-manifest:
    needs: [ build ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch images into a multi-arch manifest
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/joichiroakimoto/hw-genie"
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: Invalid tag '$REF_NAME'. Must be in format vX.Y.Z" >&2
              exit 1
            fi
            TAGS="$REF_NAME"
          elif [[ "$REF" == "refs/heads/main" ]]; then
            TAGS="latest"
          else
            echo "ERROR: Image push is only allowed from main or version tags (ref: $REF)" >&2
            exit 1
          fi
          for tag in $TAGS; do
            docker buildx imagetools create \
              -t "$IMAGE:$tag" \
              "$IMAGE:$tag-amd64" \
              "$IMAGE:$tag-arm64"
          done