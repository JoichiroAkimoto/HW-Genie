name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Dependabot の PR はスキップ
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GEMINI_MODEL: gemini-3-flash-preview # モデル名をここで一括管理
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # キャッシュを有効化

      - name: Install dependencies
        run: |
          pip install google-generativeai

      - name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<EOF
          import os
          import google.generativeai as genai
          import subprocess
          import json

          def main():
              api_key = os.environ.get('GEMINI_API_KEY')
              if not api_key:
                  print("Error: GEMINI_API_KEY is not set.")
                  exit(1)

              genai.configure(api_key=api_key)
              model_name = os.environ['GEMINI_MODEL']
              model = genai.GenerativeModel(model_name)
              pr_number = os.environ['PR_NUMBER']

              # Get PR diff
              try:
                  diff = subprocess.check_output(['gh', 'pr', 'diff', pr_number]).decode('utf-8')
              except Exception as e:
                  print(f"Error getting diff: {e}")
                  exit(0)

              if not diff:
                  print("No diff found.")
                  exit(0)

              # Handle large diffs
              limit = 100000
              is_truncated = False
              if len(diff) > limit:
                  diff = diff[:limit]
                  is_truncated = True

              # Prepare prompt
              prompt = f"""
          以下のPull Requestの差分（diff）を分析し、簡潔にレビューしてください。
          
          フォーマット：
          - **要約**: 変更点（箇条書き）
          - **懸念点**: 重大なバグ、パフォーマンス、セキュリティ
          - **改善案**: コード品質向上
          - **称賛**: 良い実装

          ---
          {diff}
          """

              try:
                  # Generate review with high reasoning configuration
                  response = model.generate_content(
                      prompt,
                      generation_config=genai.types.GenerationConfig(
                          temperature=0.2, # 再現性を高めるために低く
                          max_output_tokens=2048,
                      )
                  )
                  
                  # Create review content
                  body = response.text
                  
                  # Metadata footer (tokens)
                  usage = response.usage_metadata
                  metadata = f"\n\n---\n<details><summary>📊 Review Metadata</summary>\n\n"
                  metadata += f"- **Model**: `{model_name}`\n"
                  metadata += f"- **Tokens**: In={usage.prompt_token_count}, Out={usage.candidates_token_count}\n"
                  if is_truncated:
                      metadata += "- **Status**: ⚠️ Diff was truncated due to size limits.\n"
                  metadata += "</details>\n\n<!-- ai-pr-reviewer-comment -->"

                  review_text = f"### 🤖 AI Code Review\n\n{body}{metadata}"

                  # Post/Update comment with Error Handling
                  repo = os.environ['GITHUB_REPOSITORY']
                  with open('review.md', 'w') as f:
                      f.write(review_text)

                  try:
                      # Find existing comment
                      comments_json = subprocess.check_output(['gh', 'api', f'repos/{repo}/issues/{pr_number}/comments']).decode('utf-8')
                      comments = json.loads(comments_json)
                      existing_comment = next((c for c in comments if "<!-- ai-pr-reviewer-comment -->" in c['body']), None)

                      if existing_comment:
                          subprocess.run(['gh', 'api', '-X', 'PATCH', f'repos/{repo}/issues/comments/{existing_comment["id"]}', '-F', 'body=@review.md'], check=True)
                      else:
                          subprocess.run(['gh', 'pr', 'comment', pr_number, '--body-file', 'review.md'], check=True)
                  except Exception as api_e:
                      print(f"GitHub API Error (Non-fatal): {api_e}")
                      # Fallback: Just print to stdout if comment update fails
              except Exception as e:
                  print(f"Gemini Review Error: {e}")
                  
          if __name__ == "__main__":
              main()
          EOF
