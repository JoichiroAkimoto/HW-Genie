name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Dependabot の PR はスキップ
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install google-generativeai

      - name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<EOF
          import os
          import google.generativeai as genai
          import subprocess

          # Gemini Setup
          genai.configure(api_key=os.environ['GEMINI_API_KEY'])
          # ユーザー指定の最新プレビューモデルを使用
          model = genai.GenerativeModel('gemini-3-flash-preview')

          # Get PR diff
          try:
              diff = subprocess.check_output(['gh', 'pr', 'diff', os.environ['PR_NUMBER']]).decode('utf-8')
          except Exception as e:
              print(f"Error getting diff: {e}")
              exit(0)

          if not diff:
              print("No diff found.")
              exit(0)

          # Prepare prompt
          prompt = f"""
          あなたはシニアソフトウェアエンジニアとして、Pull Requestのコードレビューを行います。
          以下の差分（diff）を分析し、日本語で回答してください。

          【指示】
          1. 最初に変更の要約（何をしようとしているか）を簡潔に述べてください。
          2. 重大なバグ、パフォーマンスの問題、セキュリティの懸念がある場合にのみ指摘してください。
          3. 些細な指摘やスタイルの好みは避けてください。
          4. 良い実装があれば褒めてください。

          【差分】
          {diff[:15000]} # 安全のため文字数を制限
          """

          # Generate review
          try:
              response = model.generate_content(prompt)
              review_text = f"### 🤖 AI Code Review (Gemini 1.5 Flash)\n\n{response.text}"
          except Exception as e:
              review_text = f"### 🤖 AI Code Review Error\n\nGeminiでのレビュー生成中にエラーが発生しました: {e}"

          # Post comment to PR
          with open('review.md', 'w') as f:
              f.write(review_text)

          subprocess.run(['gh', 'pr', 'comment', os.environ['PR_NUMBER'], '--body-file', 'review.md'])
          EOF
