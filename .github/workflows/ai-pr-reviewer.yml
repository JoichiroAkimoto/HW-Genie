name: '⚡ AI Quick Review'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.db'
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.gif'
      - '**.webp'
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      model:
        description: 'Select AI Model'
        type: choice
        options:
          - flash-lite
          - gemma
        default: 'flash-lite'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ inputs.pr_number || github.event.issue.pull_request && format('pr-{0}', github.event.issue.number) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements-ai.txt'

      - name: Install dependencies
        run: |
          pip install -r .github/scripts/requirements-ai.txt

      - name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_call: dispatch 経由 (issue_comment/pull_request イベント)
          # workflow_dispatch: Actions UI から手動実行
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
          MODEL_KEY: ${{ inputs.model || 'flash-lite' }}
        run: |
          python .github/scripts/ai_review.py
