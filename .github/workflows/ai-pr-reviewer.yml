name: '⚡ AI Quick Review'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.db'
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.gif'
      - '**.webp'
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      model:
        description: 'Select AI Model'
        type: choice
        options:
          - flash-lite
          - flash
          - openrouter/free
        default: 'flash-lite'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # Skip bot PRs and fork PRs — automated dependency bumps do not benefit from AI review;
    # fork PRs have no access to secrets (GEMINI_API_KEY) and would fail with exit 1.
    if: |-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) &&
      (github.event.sender.type || github.event.pull_request.user.type || github.event.issue.user.type || '') != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history is not needed: ai_review.py fetches the PR head ref
          # itself (git fetch refs/pull/N/head) and uses `gh pr diff` via API.
          fetch-depth: 1
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements-ai.txt'

      - name: Install dependencies
        run: |
          pip install -r .github/scripts/requirements-ai.txt

      - name: Run AI Review
        env:
          # Backward compat: single key
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Key rotation: comma-separated (empty secrets become "" and are filtered in Python)
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEY }},${{ secrets.GEMINI_API_KEY_2 }},${{ secrets.GEMINI_API_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEY }},${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS }}
          # Context7 free: no API key required, but CONTEXT7_API_KEY increases rate limit if set
          CONTEXT7_ENABLED: ${{ vars.CONTEXT7_ENABLED || 'true' }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          CONTEXT7_TIMEOUT: ${{ vars.CONTEXT7_TIMEOUT || '10' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_call: dispatch 経由 (issue_comment/pull_request イベント)
          # workflow_dispatch: Actions UI から手動実行
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
          MODEL_KEY: ${{ inputs.model || 'flash-lite' }}
        run: |
          python .github/scripts/ai_review.py
