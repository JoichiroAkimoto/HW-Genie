name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Dependabot の PR はスキップ
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GEMINI_MODEL: gemini-3-flash-preview # モデル名をここで一括管理
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install google-generativeai

      - name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<EOF
          import os
          import google.generativeai as genai
          import subprocess

          # Setup
          genai.configure(api_key=os.environ['GEMINI_API_KEY'])
          model_name = os.environ['GEMINI_MODEL']
          model = genai.GenerativeModel(model_name)

          # Get PR diff
          try:
              diff = subprocess.check_output(['gh', 'pr', 'diff', os.environ['PR_NUMBER']]).decode('utf-8')
          except Exception as e:
              print(f"Error getting diff: {e}")
              exit(0)

          if not diff:
              print("No diff found.")
              exit(0)

          # Prepare prompt
          prompt = f"""
          以下のPull Requestの差分を、簡潔かつ建設的にレビューしてください。
          
          内容：
          1. 変更の要約（箇条書き）
          2. 重大な懸念点（バグ、パフォーマンス、セキュリティ）があれば指摘
          3. 改善の提案
          4. 良い実装への称賛

          ---
          {diff[:20000]}
          """

          # Generate review
          try:
              response = model.generate_content(prompt)
              review_header = f"### 🤖 AI Code Review ({model_name})"
              review_text = f"{review_header}\n\n{response.text}\n\n---\n*このレビューは自動生成されました。*"
          except Exception as e:
              review_text = f"### 🤖 AI Code Review Error\n\nレビュー生成中にエラーが発生しました: {e}"

          # Post comment
          with open('review.md', 'w') as f:
              f.write(review_text)

          subprocess.run(['gh', 'pr', 'comment', os.environ['PR_NUMBER'], '--body-file', 'review.md'])
          EOF
