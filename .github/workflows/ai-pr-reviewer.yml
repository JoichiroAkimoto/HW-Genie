name: AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Dependabot の PR はスキップ
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GEMINI_MODEL: gemini-3-flash-preview
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # キャッシュを有効化

      - name: Install dependencies
        run: |
          pip install google-generativeai

      - name: Run AI Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<EOF
          import os
          import google.generativeai as genai
          import subprocess
          import json

          def main():
              api_key = os.environ.get('GEMINI_API_KEY')
              if not api_key:
                  print("Error: GEMINI_API_KEY is not set.")
                  exit(1)

              genai.configure(api_key=api_key)
              model_name = os.environ['GEMINI_MODEL']
              model = genai.GenerativeModel(model_name)
              pr_number = os.environ['PR_NUMBER']

              # Get PR diff
              try:
                  diff = subprocess.check_output(['gh', 'pr', 'diff', pr_number]).decode('utf-8')
              except Exception as e:
                  print(f"Error getting diff: {e}")
                  exit(0)

              if not diff:
                  print("No diff found.")
                  exit(0)

              # Handle large diffs
              limit = 25000
              is_truncated = False
              if len(diff) > limit:
                  diff = diff[:limit]
                  is_truncated = True

              # Prepare prompt
              prompt = f"""
          以下のPull Requestの差分（diff）を分析し、簡潔にレビューしてください。
          
          フォーマット：
          - **要約**: 変更点（箇条書き）
          - **懸念点**: 重大なバグ、パフォーマンス、セキュリティ
          - **改善案**: コード品質向上
          - **称賛**: 良い実装

          ---
          {diff}
          """

              try:
                  response = model.generate_content(prompt)
                  review_text = f"### 🤖 AI Code Review ({model_name})\n\n"
                  if is_truncated:
                      review_text += "> [!WARNING]\n> 差分が大きいため、一部のみレビューしています。\n\n"
                  review_text += response.text
                  review_text += "\n\n<!-- ai-pr-reviewer-comment -->" # 識別用タグ

                  # Find existing comment to update
                  comments_json = subprocess.check_output(['gh', 'api', f'repos/{{{{ .repository.full_name }}}}/issues/{pr_number}/comments']).decode('utf-8')
                  comments = json.loads(comments_json)
                  existing_comment = next((c for c in comments if "<!-- ai-pr-reviewer-comment -->" in c['body']), None)

                  with open('review.md', 'w') as f:
                      f.write(review_text)

                  if existing_comment:
                      # Update existing comment
                      subprocess.run(['gh', 'api', '-X', 'PATCH', f'repos/{{{{ .repository.full_name }}}}/issues/comments/{existing_comment["id"]}', '-F', 'body=@review.md'])
                      print(f"Updated comment {existing_comment['id']}")
                  else:
                      # Create new comment
                      subprocess.run(['gh', 'pr', 'comment', pr_number, '--body-file', 'review.md'])
                      print("Created new comment")
              except Exception as e:
                  print(f"Review Error: {e}")
                  
          if __name__ == "__main__":
              main()
          EOF
