name: '⚡ AI Quick Review'

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.db'
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.gif'
      - '**.webp'
  workflow_call:
    inputs:
      additional_context:
        type: 'string'
        description: 'Any additional context from the request'
        required: false
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string
      model:
        description: 'Select AI Model'
        type: choice
        options:
          - opencode/deepseek-v4.1-flash-free
          - opencode/hy4-flash-free
          - opencode-go/hy4-flash-free
          - opencode-go/deepseek-v4.1-flash
          - hydrogen
          - flash-lite
          - flash
          - openrouter/free
        default: 'hydrogen'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # Skip bot PRs and fork PRs — automated dependency bumps do not benefit from AI review;
    # fork PRs have no access to secrets (GEMINI_API_KEY) and would fail with exit 1.
    if: |-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) &&
      (github.event.sender.type || github.event.pull_request.user.type || github.event.issue.user.type || '') != 'Bot'
    runs-on: ubuntu-latest
    env:
      # 未指定ならインストーラが最新を解決する。固定したい場合のみ repo variable を設定する。
      OPENCODE_CLI_VERSION: ${{ vars.OPENCODE_CLI_VERSION }}
      # ジョブ制限と Python 側の時間予算を同じ repo variable から導出する。
      REVIEW_TIMEOUT_MINUTES: ${{ vars.REVIEW_TIMEOUT_MINUTES || '15' }}
    # 大型 PR では OpenRouter のリトライが主因で長くなるため、既定 15 分。
    # 変更は repo variable REVIEW_TIMEOUT_MINUTES の一点から行う。
    timeout-minutes: ${{ fromJSON(vars.REVIEW_TIMEOUT_MINUTES || '15') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history is not needed: ai_review.py fetches the PR head ref
          # itself (git fetch refs/pull/N/head) and uses `gh pr diff` via API.
          fetch-depth: 1
          ref: ${{ github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number) || (inputs.pr_number && format('refs/pull/{0}/head', inputs.pr_number) || github.sha) }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '.github/scripts/requirements-ai.txt'

      - name: Install dependencies
        run: |
          pip install -r .github/scripts/requirements-ai.txt

      - name: Cache OpenCode CLI
        id: cache_opencode
        # バージョン固定時のみキャッシュする（未指定=最新なのでキャッシュすると古くなる）。
        if: env.OPENCODE_CLI_VERSION != ''
        uses: actions/cache@v4
        with:
          path: ~/.opencode/bin
          key: ${{ runner.os }}-${{ runner.arch }}-opencode-${{ env.OPENCODE_CLI_VERSION }}

      - name: Install OpenCode CLI
        # インストール失敗でもレビューを止めない（スクリプト側のフォールバックに委ねる）。
        if: steps.cache_opencode.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          args=(--no-modify-path)
          if [ -n "$OPENCODE_CLI_VERSION" ]; then
            args+=(--version "$OPENCODE_CLI_VERSION")
          fi
          # 失敗時に空ディレクトリがキャッシュへ保存されるのを防ぐ。
          if ! curl -fsSL https://opencode.ai/v2/install | bash -s -- "${args[@]}"; then
            rm -rf "$HOME/.opencode/bin"
            exit 1
          fi
          if ! "$HOME/.opencode/bin/opencode" --version; then
            rm -rf "$HOME/.opencode/bin"
            exit 1
          fi

      - name: Add OpenCode CLI to PATH
        # キャッシュヒット時もインストール時も同じパスを通す。
        run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run AI Review
        env:
          # stdout をリアルタイム化（打ち切り時にバッファ出力を失わないため）
          PYTHONUNBUFFERED: 1
          # OpenCode provider（既定の無料 DeepSeek / --model opencode/* で使用）。
          # 未登録の場合はスクリプトが Gemini チェーンへフォールバックする。
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Backward compat: single key
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Key rotation: comma-separated (empty secrets become "" and are filtered in Python)
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEY }},${{ secrets.GEMINI_API_KEY_2 }},${{ secrets.GEMINI_API_KEY_3 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEY }},${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_FALLBACK_MODELS: ${{ vars.OPENROUTER_FALLBACK_MODELS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # workflow_call: dispatch 経由 (issue_comment/pull_request イベント)
          # workflow_dispatch: Actions UI から手動実行
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
          MODEL_KEY: ${{ inputs.model || 'hydrogen' }}
        run: |
          python .github/scripts/ai_review.py

      # コメント投稿が失敗しても生成済みレビューを回収できるようにする
      - name: Upload AI review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review
          path: review.md
          if-no-files-found: ignore
