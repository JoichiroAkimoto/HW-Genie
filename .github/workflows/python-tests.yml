name: Python Checks

on:
  push:
    branches: [ main ]
    paths:
      - 'src/python/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/python/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v9
      with:
        enable-cache: true
        prune-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config

    - name: Install dependencies
      run: uv sync --locked

    - name: Lint with ruff
      run: uv run --locked ruff check src/python

    - name: Test with pytest
      run: uv run --locked pytest src/python/tests/
