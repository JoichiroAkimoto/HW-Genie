name: Python Checks

on:
  push:
    branches: [ main ]
    paths:
      - 'src/python/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/python/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Lint with ruff
      run: |
        cd src/python
        uv run --extra dev ruff check .

    - name: Test with pytest
      run: |
        cd src/python
        uv run --extra dev pytest tests/
