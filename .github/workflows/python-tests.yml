name: Python Checks

on:
  push:
    branches: [ main ]
    paths:
      - 'src/python/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/python/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config

    - name: Lint with ruff
      run: uv run --project src/python --extra dev ruff check src/python

    - name: Test with pytest
      run: uv run --project src/python --extra dev pytest src/python/tests/
