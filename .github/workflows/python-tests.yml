name: Python Checks

on:
  push:
    branches: [ main ]
    paths:
      - 'src/python/**'
      - '.github/scripts/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/python/**'
      - '.github/scripts/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      # NOTE: setup-uv v8/v9 系はメジャータグ（v8/v9）が切られていないため
      # 完全版タグ v9.0.0 を指定する（@v9 だと resolve エラーになる）
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
        prune-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config

    - name: Install dependencies
      run: uv sync --locked --group ci

    - name: Lint with ruff
      run: uv run --locked ruff check src/python .github/scripts

    - name: Test with pytest
      run: uv run --locked pytest src/python/tests/ .github/scripts/tests/
