name: Python Checks

on:
  push:
    branches: [ main ]
    paths:
      - 'src/python/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/python/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: 'src/python/pyproject.toml'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e "src/python[dev]"
    - name: Lint with ruff
      run: ruff check src/python
    - name: Test with pytest
      run: pytest src/python/tests/
