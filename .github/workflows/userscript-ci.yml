name: Userscript CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/userscripts/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/userscript-ci.yml'
      - 'RELEASE_PROCESS.md'
      - 'src/userscripts/README.md'
  push:
    branches:
      - main
    paths:
      - 'src/userscripts/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/userscript-ci.yml'
      - 'RELEASE_PROCESS.md'
      - 'src/userscripts/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: src/userscripts

      - name: Run userscript tests
        run: bun test tests/
        working-directory: src/userscripts

      - name: Build and validate synthetic artifact
        run: |
          VERSION=$(bash ./release-metadata.sh version ./index.ts)
          bash ./build.sh \
            --inject-download-url "https://github.com/example/example/releases/latest/download/hw-genie-auth-capture.user.js" \
            --inject-update-url "https://github.com/example/example/releases/latest/download/hw-genie-auth-capture.user.js"
          bash ./release-metadata.sh validate-artifact \
            ./dist/hw-genie-auth-capture.user.js \
            "$VERSION" \
            "example/example"
        working-directory: src/userscripts

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: .github/workflows/release.yml .github/workflows/userscript-ci.yml
