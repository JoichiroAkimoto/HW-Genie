name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Verify /assets references exist
        shell: bash
        run: |
          set -euo pipefail
          # ここで強制するのは「走査対象ファイルの存在」のみ。ファイルが欠損すると
          # grep が 0 件で参照チェックが空転するため error にする（参照全削除は検出しない）。
          targets=(
            src/userscripts/index.ts
            docs/_includes/head-custom.html
            docs/_config.yml
            docs/index.md
            README.md
            src/userscripts/README.md
          )
          for f in "${targets[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::scan target '$f' is missing; /assets references cannot be verified"
              exit 1
            fi
          done
          missing=0
          while IFS= read -r ref; do
            # remote_theme 側が用意するアセットは docs/ に置かないので検証対象外
            case "$ref" in
              /assets/css | /assets/css/*) continue ;;
            esac
            if [ ! -f "docs${ref}" ]; then
              echo "::error::${ref} is referenced but docs${ref} is missing"
              missing=1
            fi
          done < <(grep -hoE '/assets/[A-Za-z0-9._-]+' "${targets[@]}" | sort -u)
          exit "$missing"
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: docs
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
