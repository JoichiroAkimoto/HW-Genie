name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '@version' src/userscripts/index.ts | sed 's/.* //')
          TAG_NAME=${GITHUB_REF#refs/tags/}
          # X.Y.Z 形式の検証（v1.0 / v1.0.4.1 等の不正形式を先に弾く。
          # 不正なバージョンは存在しない download URL を生成し、
          # releases/latest の自動更新を静かに壊す）。
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: @version '$VERSION' is not a valid semver (X.Y.Z)" >&2
            exit 1
          fi
          # タグと @version の不一致を防ぐ。不一致だと既存リリースを
          # --clobber で上書きし、releases/latest の自動更新が静かに壊れる。
          if [[ "v$VERSION" != "$TAG_NAME" ]]; then
            echo "ERROR: tag $TAG_NAME does not match @version v$VERSION in index.ts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: src/userscripts

      - name: Build userscript
        # downloadURL はバージョン固定、updateURL は常に最新リリースを指す
        # （releases/latest/download/...）。updateURL がバージョン固定だと
        # Tampermonkey は常に同じ URL を確認し、新しいリリースを検知できない。
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/hw-genie-auth-capture.user.js"
          UPDATE_URL="https://github.com/${{ github.repository }}/releases/latest/download/hw-genie-auth-capture.user.js"
          bash ./build.sh --inject-download-url "$DOWNLOAD_URL" --inject-update-url "$UPDATE_URL"
        working-directory: src/userscripts

      - name: Create or Update Release
        id: release
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          
          # Check if release exists
          if gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" 2>/dev/null; then
            echo "Release exists, uploading asset..."
            gh release upload "v${{ steps.version.outputs.version }}" "src/userscripts/dist/hw-genie-auth-capture.user.js" --clobber
          else
            echo "Creating new release..."
            gh release create "v${{ steps.version.outputs.version }}" \
              --title "v${{ steps.version.outputs.version }}" \
              --notes "Userscript release v${{ steps.version.outputs.version }}" \
              "src/userscripts/dist/hw-genie-auth-capture.user.js"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify Release
        run: |
          gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" --json name,url,assets
        env:
          GH_TOKEN: ${{ github.token }}