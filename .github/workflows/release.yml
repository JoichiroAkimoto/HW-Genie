name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target tag to release (e.g. v1.0.5)'
        required: true
        type: string
      release_mode:
        description: 'Release mode (normal or recovery)'
        required: true
        type: choice
        options:
          - normal
          - recovery
        default: normal
      expected_latest_tag:
        description: 'Expected latest tag (Required if release_mode=recovery, e.g. v1.0.4)'
        required: false
        type: string

concurrency:
  group: userscript-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine target tag and release mode
        id: init
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_MODE: ${{ inputs.release_mode }}
          INPUT_EXPECTED_LATEST: ${{ inputs.expected_latest_tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TARGET_TAG="$PUSH_TAG"
            RELEASE_MODE="normal"
            EXPECTED_LATEST_TAG=""
          else
            TARGET_TAG="$INPUT_TAG"
            RELEASE_MODE="$INPUT_MODE"
            EXPECTED_LATEST_TAG="$INPUT_EXPECTED_LATEST"
          fi

          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Target tag '$TARGET_TAG' is invalid. Must be in format vX.Y.Z" >&2
            exit 1
          fi

          if [[ "$RELEASE_MODE" == "recovery" ]]; then
            if [[ -z "$EXPECTED_LATEST_TAG" ]]; then
              echo "ERROR: expected_latest_tag is required when release_mode=recovery" >&2
              exit 1
            fi
            if [[ ! "$EXPECTED_LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: expected_latest_tag '$EXPECTED_LATEST_TAG' is invalid. Must be in format vX.Y.Z" >&2
              exit 1
            fi
          fi

          {
            echo "target_tag=$TARGET_TAG"
            echo "release_mode=$RELEASE_MODE"
            echo "expected_latest_tag=$EXPECTED_LATEST_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout target tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.init.outputs.target_tag }}

      - name: Preflight validation
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.init.outputs.target_tag }}
          RELEASE_MODE: ${{ steps.init.outputs.release_mode }}
          EXPECTED_LATEST_TAG: ${{ steps.init.outputs.expected_latest_tag }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x src/userscripts/release-metadata.sh
          VERSION=$(bash src/userscripts/release-metadata.sh version src/userscripts/index.ts)
          bash src/userscripts/release-metadata.sh validate-tag src/userscripts/index.ts "$TARGET_TAG"

          # Check existing release for target tag
          EXISTING_TARGET_JSON=$(gh release view "$TARGET_TAG" --repo "$REPO" --json tagName,isDraft,isPrerelease,isLatest 2>/dev/null || true)

          if [[ -n "$EXISTING_TARGET_JSON" ]]; then
            IS_DRAFT=$(echo "$EXISTING_TARGET_JSON" | jq -r '.isDraft')
            IS_PRERELEASE=$(echo "$EXISTING_TARGET_JSON" | jq -r '.isPrerelease')
            if [[ "$IS_DRAFT" == "true" || "$IS_PRERELEASE" == "true" ]]; then
              echo "ERROR: Release '$TARGET_TAG' is draft or prerelease. Please inspect/publish manually before running release workflow." >&2
              exit 1
            fi
          fi

          # Get current stable latest release
          CURRENT_LATEST_JSON=$(gh release view --repo "$REPO" --json tagName,isDraft,isPrerelease,isLatest 2>/dev/null || true)
          CURRENT_LATEST_TAG=""
          if [[ -n "$CURRENT_LATEST_JSON" ]]; then
            CURRENT_LATEST_TAG=$(echo "$CURRENT_LATEST_JSON" | jq -r '.tagName')
          fi

          if [[ "$RELEASE_MODE" == "normal" ]]; then
            if [[ -n "$CURRENT_LATEST_TAG" ]]; then
              LATEST_VER="${CURRENT_LATEST_TAG#v}"
              LOWER_VER=$(printf '%s\n%s\n' "$VERSION" "$LATEST_VER" | sort -V | head -n 1)
              if [[ "$VERSION" != "$LATEST_VER" && "$LOWER_VER" == "$VERSION" ]]; then
                echo "ERROR: Target version '$VERSION' is older than current latest version '$LATEST_VER'. Use release_mode=recovery to repair older releases." >&2
                exit 1
              fi
            fi
          elif [[ "$RELEASE_MODE" == "recovery" ]]; then
            if [[ -z "$CURRENT_LATEST_TAG" ]]; then
              echo "ERROR: Cannot use recovery mode when no stable latest release exists." >&2
              exit 1
            fi
            if [[ "$CURRENT_LATEST_TAG" != "$EXPECTED_LATEST_TAG" ]]; then
              echo "ERROR: Current latest release is '$CURRENT_LATEST_TAG', but expected_latest_tag is '$EXPECTED_LATEST_TAG'." >&2
              exit 1
            fi
            if [[ -n "$EXISTING_TARGET_JSON" ]]; then
              IS_TARGET_LATEST=$(echo "$EXISTING_TARGET_JSON" | jq -r '.isLatest')
              if [[ "$IS_TARGET_LATEST" == "true" && "$TARGET_TAG" != "$EXPECTED_LATEST_TAG" ]]; then
                echo "ERROR: Target tag '$TARGET_TAG' is currently marked latest, but expected_latest_tag is '$EXPECTED_LATEST_TAG'." >&2
                exit 1
              fi
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: src/userscripts

      - name: Build userscript
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
          TARGET_TAG: ${{ steps.init.outputs.target_tag }}
          REPO: ${{ github.repository }}
        run: |
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TARGET_TAG}/hw-genie-auth-capture.user.js"
          UPDATE_URL="https://github.com/${REPO}/releases/latest/download/hw-genie-auth-capture.user.js"
          bash ./build.sh --inject-download-url "$DOWNLOAD_URL" --inject-update-url "$UPDATE_URL"
          bash ./release-metadata.sh validate-artifact ./dist/hw-genie-auth-capture.user.js "$VERSION" "$REPO"
        working-directory: src/userscripts

      - name: Create or update Release
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
          TARGET_TAG: ${{ steps.init.outputs.target_tag }}
          RELEASE_MODE: ${{ steps.init.outputs.release_mode }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(printf 'Userscript release %s\n\n注: v1.0.4以前のバージョンをお使いの場合、自動更新を有効にするには一度手動での再インストール（https://github.com/%s/releases/latest/download/hw-genie-auth-capture.user.js）が必要です。' "$TARGET_TAG" "$REPO")

          if gh release view "$TARGET_TAG" --repo "$REPO" 2>/dev/null; then
            echo "Release '$TARGET_TAG' exists. Uploading asset and updating notes..."
            gh release upload "$TARGET_TAG" "src/userscripts/dist/hw-genie-auth-capture.user.js" --repo "$REPO" --clobber
            gh release edit "$TARGET_TAG" --repo "$REPO" --notes "$NOTES"
          else
            echo "Creating release '$TARGET_TAG' (mode: $RELEASE_MODE)..."
            if [[ "$RELEASE_MODE" == "normal" ]]; then
              gh release create "$TARGET_TAG" \
                --repo "$REPO" \
                --verify-tag \
                --latest \
                --title "$TARGET_TAG" \
                --notes "$NOTES" \
                "src/userscripts/dist/hw-genie-auth-capture.user.js"
            else
              gh release create "$TARGET_TAG" \
                --repo "$REPO" \
                --verify-tag \
                --latest=false \
                --title "$TARGET_TAG" \
                --notes "$NOTES" \
                "src/userscripts/dist/hw-genie-auth-capture.user.js"
            fi
          fi

      - name: Verify Published Release
        env:
          VERSION: ${{ steps.preflight.outputs.version }}
          TARGET_TAG: ${{ steps.init.outputs.target_tag }}
          RELEASE_MODE: ${{ steps.init.outputs.release_mode }}
          EXPECTED_LATEST_TAG: ${{ steps.init.outputs.expected_latest_tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # 1. Verify GH API state for target release
          TARGET_INFO=$(gh release view "$TARGET_TAG" --repo "$REPO" --json isDraft,isPrerelease,assets)
          IS_DRAFT=$(echo "$TARGET_INFO" | jq -r '.isDraft')
          IS_PRERELEASE=$(echo "$TARGET_INFO" | jq -r '.isPrerelease')
          if [[ "$IS_DRAFT" != "false" || "$IS_PRERELEASE" != "false" ]]; then
            echo "ERROR: Published release '$TARGET_TAG' must not be draft or prerelease" >&2
            exit 1
          fi

          ASSET_SIZE=$(echo "$TARGET_INFO" | jq -r '.assets[] | select(.name=="hw-genie-auth-capture.user.js") | .size')
          if [[ -z "$ASSET_SIZE" || "$ASSET_SIZE" -le 0 ]]; then
            echo "ERROR: Asset 'hw-genie-auth-capture.user.js' is missing or empty in release '$TARGET_TAG'" >&2
            exit 1
          fi

          # 2. Network verification for fixed download URL
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TARGET_TAG}/hw-genie-auth-capture.user.js"
          echo "Fetching fixed download URL: $DOWNLOAD_URL"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 3 -o fixed-artifact.user.js "$DOWNLOAD_URL"
          bash src/userscripts/release-metadata.sh validate-artifact fixed-artifact.user.js "$VERSION" "$REPO"

          # 3. Verify latest URL and API latest pointer
          UPDATE_URL="https://github.com/${REPO}/releases/latest/download/hw-genie-auth-capture.user.js"
          echo "Fetching latest update URL: $UPDATE_URL"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 3 -o latest-artifact.user.js "$UPDATE_URL"

          CURRENT_LATEST_JSON=$(gh release view --repo "$REPO" --json tagName)
          API_LATEST_TAG=$(echo "$CURRENT_LATEST_JSON" | jq -r '.tagName')

          if [[ "$RELEASE_MODE" == "normal" ]]; then
            if [[ "$API_LATEST_TAG" != "$TARGET_TAG" ]]; then
              echo "ERROR: Latest release tag is '$API_LATEST_TAG', expected '$TARGET_TAG' in normal mode" >&2
              exit 1
            fi
            bash src/userscripts/release-metadata.sh validate-artifact latest-artifact.user.js "$VERSION" "$REPO"
          else
            if [[ "$API_LATEST_TAG" != "$EXPECTED_LATEST_TAG" ]]; then
              echo "ERROR: Latest release tag is '$API_LATEST_TAG', expected '$EXPECTED_LATEST_TAG' in recovery mode" >&2
              exit 1
            fi
            EXPECTED_LATEST_VER="${EXPECTED_LATEST_TAG#v}"
            bash src/userscripts/release-metadata.sh validate-artifact latest-artifact.user.js "$EXPECTED_LATEST_VER" "$REPO"
          fi

          echo "Release verification successful for $TARGET_TAG (mode: $RELEASE_MODE)."