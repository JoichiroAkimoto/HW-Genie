x-db-env: &db-env
  # SQLite (default): sqlite:////app/data/hw_genie.db
  # libSQL (Turso): sqlite+libsql://[your-db].turso.io/?auth_token=[your-token]&secure=true
  DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/hw_genie.db}
  # Turso Embedded Replicas (Syncs): set DATABASE_URL to a local file
  # (e.g. sqlite:////app/data/hw_genie.db) and provide the values below to
  # enable local-replica sync. When unset, sync is disabled.
  TURSO_SYNC_URL: ${TURSO_SYNC_URL:-}
  TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
  TURSO_SYNC_INTERVAL: ${TURSO_SYNC_INTERVAL:-}

services:
  auth-server:
    build: .
    user: "1000:1000"
    ports:
      - "8765:8765"
    environment:
      <<: *db-env
      HW_GENIE_AUTH_PORT: 8765
      HW_GENIE_AUTH_HOST: 0.0.0.0
    volumes:
      # マウント先をディレクトリにすることで、SQLite のジャーナルファイル作成等でのトラブルを防ぐ
      - ./data:/app/data
      # ソース変更は再ビルド不要。反映には `docker compose restart auth-server` を実行する。
      - ./src/python/hw_genie:/app/hw_genie

  # Bulk runner: runs a routine for ALL accounts inside a single container
  # process (parallel thread pool). Reuses the same image/build as auth-server,
  # so the DB (and optional Turso Syncs) is already present.
  #
  # Examples (run with the service's profile enabled, or `docker compose run`):
  #   docker compose --profile bulk up --build -d hwda
  #   docker compose run --rm hwda --parallel 4 account1 account2   # daily
  #   docker compose run --rm hwsa                                   # full
  #
  # The service `command` already supplies `multi daily` / `multi full`, so
  # pass only ACCOUNT ALIASES and/or --parallel. Do NOT re-pass `multi daily`.
  # HWDA_MAX_PARALLEL caps concurrency (0/unset = unbounded).
  hwda:
    build: .
    user: "1000:1000"
    environment:
      <<: *db-env
      HWDA_MAX_PARALLEL: ${HWDA_MAX_PARALLEL:-}
    volumes:
      - ./data:/app/data
      - ./src/python/hw_genie:/app/hw_genie
    command: ["hw-genie", "multi", "daily"]
    profiles: ["bulk"]

  hwsa:
    build: .
    user: "1000:1000"
    environment:
      <<: *db-env
      HWDA_MAX_PARALLEL: ${HWDA_MAX_PARALLEL:-}
    volumes:
      - ./data:/app/data
      - ./src/python/hw_genie:/app/hw_genie
    command: ["hw-genie", "multi", "full"]
    profiles: ["bulk"]
