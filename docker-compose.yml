services:
  auth-server:
    build: .
    ports:
      - "8765:8765"
    environment:
      # SQLite (default): sqlite:///app/hw_genie.db
      # libSQL (Turso): sqlite+libsql://[your-db].turso.io?auth_token=[your-token]
      - DATABASE_URL=sqlite:///app/hw_genie.db
      - HW_GENIE_AUTH_PORT=8765
    volumes:
      - ./hw_genie.db:/app/hw_genie.db
